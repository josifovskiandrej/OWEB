<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations | Aero</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/plane-ico.webp">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <nav class="navbar navbar-light aero-nav sticky-top">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
            <img src="../assets/img/plane.webp" height="30" class="mr-2" alt="">
            Aero
        </a>
        <div>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav flex-row flex-wrap justify-content-around align-items-center py-2">
                <li class="nav-item">
                    <a class="nav-link" href="dest.html">Destinations</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">Gallery</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="blog.html">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="survey.html">User Survey</a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-accent rounded-pill px-3" type="button">Log in</button>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container mt-4">
        <h2>Destinations</h2>

        <ul class="blog-tabs list-unstyled mb-4" id="viewPills">
            <li>
                <button type="button" class="blog-tab active" id="btnDestTab" onclick="switchView('dest')">
                    Viewer
                </button>
            </li>
            <li>
                <button type="button" class="blog-tab" id="btnCalcTab" onclick="switchView('calc')">
                    Trip Calculator
                </button>
            </li>
        </ul>

        <div id="destSection">
            <div class="form-row mb-4">
                <div class="col-6 col-md-3"><label class="small" for="days">Days</label><input class="form-control"
                        id="days" type="number" min="1" value="3"></div>
                <div class="col-6 col-md-3"><label class="small" for="ppl">Persons</label><input class="form-control"
                        id="ppl" type="number" min="1" value="1"></div>
                <div class="col-6 col-md-3"><label class="small" for="max">Max budget €</label><input
                        class="form-control" id="max" type="number" min="0" placeholder="no limit"></div>
                <div class="col-6 col-md-3"><label class="small" for="cat">Category</label><select class="form-control"
                        id="cat"></select></div>
            </div>

            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <h5>Add a destination</h5>
                            <form id="add" novalidate>
                                <input class="form-control mb-2" id="fname" placeholder="City" required>
                                <input class="form-control mb-2" id="fcountry" placeholder="Country" required>
                                <select class="form-control mb-2" id="fcat"></select>
                                <input type="number" min="0" class="form-control mb-2" id="fflight"
                                    placeholder="Flight &lpar;&euro;&rpar; &#47; person" required>
                                <input type="number" min="0" class="form-control mb-2" id="fday"
                                    placeholder="Stay &#43; food &lpar;&euro;&rpar; &#47; person &#47; day" required>
                                <textarea class="form-control mb-2" id="fdesc" rows="2"
                                    placeholder="Description"></textarea>
                                <button class="btn btn-accent btn-block">Add</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="row" id="list"></div>
                </div>
            </div>
        </div>

        <div id="calcSection" class="d-none">
            <div class="row">
                <div class="col-lg-4 mb-4">
                    <h5>Pick a destination</h5>
                    <div id="picker"></div>
                </div>
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <h3 id="chosen" class="mb-3"></h3>
                            <div class="form-row mb-3">
                                <div class="col"><label for="calcDays">Days</label><input type="number" min="1"
                                        value="3" class="form-control" id="calcDays"></div>
                                <div class="col"><label for="calcPpl">Persons</label><input type="number" min="1"
                                        value="1" class="form-control" id="calcPpl"></div>
                            </div>
                            <div id="out"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="aero-footer py-4 mt-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5>Aero</h5>
                    <p class="mb-1">Go airborne, without the headaches.</p>
                    <div>
                        <a href="dest.html">Destinations</a> ·
                        <a href="gallery.html">Gallery</a> ·
                        <a href="blog.html">Blog</a> ·
                        <a href="survey.html">User Survey</a>
                    </div>
                </div>

                <div class="col-md-6 text-md-right mt-4 mt-md-0">
                    <img src="../assets/img/plane.webp" alt="Aero logo" height="50">
                    <p class="small mt-2 mb-0">© 2026 Aero</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/dest.js"></script>
</body>

</html>
