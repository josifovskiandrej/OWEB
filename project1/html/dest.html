<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations | Aero</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/plane-ico.webp">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-light aero-nav sticky-top">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
            <img src="../assets/img/plane.webp" height="30" class="mr-2" alt="">
            Aero
        </a>
        <div>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav flex-row flex-wrap justify-content-around align-items-center py-2">
                <li class="nav-item">
                    <a class="nav-link" href="dest.html">Destinations</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">Gallery</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="calc.html">Calculator</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="blog.html">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-accent rounded-pill px-3" type="button">Log in</button>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container mt-4">
        <h2>Destinations</h2>
        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5>Add a destination</h5>
                        <form id="add" novalidate>
                            <input class="form-control mb-2" id="fname" placeholder="City" required>
                            <input class="form-control mb-2" id="fcountry" placeholder="Country" required>
                            <select class="form-control mb-2" id="fcat"></select>
                            <input type="number" min="0" class="form-control mb-2" id="fflight"
                                placeholder="Flight &euro; &amp; person" required>
                            <input type="number" min="0" class="form-control mb-2" id="fday"
                                placeholder="Stay &#43; food &euro; / person / day" required>
                            <textarea class="form-control mb-2" id="fdesc" rows="2"
                                placeholder="Description"></textarea>
                            <button class="btn btn-accent btn-block">Add</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="form-row mb-4">
                    <div class="col-6 col-md-3"><label class="small" for="days">Days</label><input class="form-control"
                            id="days" type="number" min="1" value="3"></div>
                    <div class="col-6 col-md-3"><label class="small" for="ppl">Persons</label><input
                            class="form-control" id="ppl" type="number" min="1" value="1"></div>
                    <div class="col-6 col-md-3"><label class="small" for="max">Max budget €</label><input
                            class="form-control" id="max" type="number" min="0" placeholder="no limit"></div>
                    <div class="col-6 col-md-3"><label class="small" for="cat">Category</label><select
                            class="form-control" id="cat"></select></div>
                </div>
                <div class="row" id="list"></div>
            </div>
        </div>
    </main>

    <footer class="aero-footer py-4 mt-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5>Aero</h5>
                    <p class="mb-1">Go airborne, without the headaches.</p>
                    <div>
                        <a href="dest.html">Destinations</a> ·
                        <a href="gallery.html">Gallery</a> ·
                        <a href="calc.html">Calculator</a> ·
                        <a href="blog.html">Blog</a> ·
                        <a href="about.html">About</a>
                    </div>
                </div>

                <div class="col-md-6 text-md-right mt-4 mt-md-0">
                    <img src="../assets/img/plane.webp" alt="Aero logo" height="50">
                    <p class="small mt-2 mb-0">© 2026 Aero</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/dest.js"></script>
</body>

</html>
