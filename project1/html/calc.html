    <main class="container mt-4">
        <h2 class="mb-4">Trip calculator</h2>
        <div class="row">
            <div class="col-lg-4 mb-4">
                <h5>Pick a destination</h5>
                <div id="picker"></div>
            </div>
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h3 id="chosen" class="mb-3"></h3>
                        <div class="form-row mb-3">
                            <div class="col"><label for="days">Days</label><input type="number" min="1" value="3"
                                    class="form-control" id="days"></div>
                            <div class="col"><label for="ppl">Persons</label><input type="number" min="1" value="1"
                                    class="form-control" id="ppl"></div>
                        </div>
                        <div id="out"></div>
                    </div>
                </div>
            </div>
        </div>
